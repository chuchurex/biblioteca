name: Verificar videos disponibles

on:
  schedule:
    - cron: '0 9 * * *'  # diario 09:00 UTC (~05:00 Chile)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar disponibilidad y podar caidos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/verificar_disponibilidad.py --aplicar

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/biblioteca.json
          if git diff --staged --quiet; then
            echo "Sin cambios: todos los videos siguen disponibles."
          else
            git commit -m "chore: podar videos no disponibles de YouTube"
            git push
          fi
